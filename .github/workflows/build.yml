name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch APKEditor (merge engine)
        run: |
          mkdir -p app/libs
          curl -L --fail -o app/libs/APKEditor.jar \
            https://github.com/REAndroid/APKEditor/releases/download/V1.4.2/APKEditor-1.4.2.jar

      - name: Generate debug keystore
        run: |
          mkdir -p app/src/main/assets
          keytool -genkeypair -storetype PKCS12 -keystore app/src/main/assets/debug.p12 \
            -alias debug -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=xapk2apk,O=Debug,C=US"

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OLIVER-debug
          path: app/build/outputs/apk/debug/*.apk
